<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employee Dashboard</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Employee Dashboard</h1>
        <p>Manage your employees</p>
      </header>

      <section class="stats">
        <div class="card">
          <h3>Total Employees</h3>
          <div id="totalEmployees">0</div>
        </div>
      </section>

      <section class="form-section">
        <h2>Add New Employee</h2>
        <form id="addEmployeeForm" class="add-form">
          <div class="form-group">
            <input type="text" id="nameInput" placeholder="Full Name" required />
          </div>
          <div class="form-group">
            <input type="text" id="deptInput" placeholder="Department (e.g. IT, HR)" required />
          </div>
          <div class="form-group">
            <input type="text" id="roleInput" placeholder="Role (e.g. Developer)" required />
          </div>
          <button type="submit" class="btn btn-primary">Add Employee</button>
        </form>
      </section>

      <section class="employee-section">
        <div class="section-header">
          <h2>Employees</h2>
          <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by name or role..." />
            <select id="departmentFilter">
              <option value="All">All Departments</option>
            </select>
            <select id="sortSelect">
              <option value="name-asc">Name: A to Z</option>
              <option value="name-desc">Name: Z to A</option>
              <option value="dept-asc">Department: A to Z</option>
            </select>
          </div>
        </div>

        <div id="employeeList"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
